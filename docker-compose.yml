services:
  web:
    image: php:8.2-apache
    container_name: teleinformatica_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html/pagina-teleinformatica
    command: >
      bash -c "a2enmod rewrite && docker-php-ext-install pdo pdo_mysql && apache2-foreground"
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: teleinformatica_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: intel
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/intel-db.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mariadb_data: